services:
  - type: web
    name: gem-bid-compliance-ai
    env: docker
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gem-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "480"
      - key: AI_PROVIDER
        value: local

databases:
  - name: gem-db
    plan: free
